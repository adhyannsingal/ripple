name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Explicit Intel macOS pool avoids hosted ARM capacity cancellations.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Load pinned Rust toolchain
        run: cargo --version
      - name: Validate plan and coordination tooling
        run: python scripts/plan.py validate
      - name: Test planning tooling
        run: python -m unittest discover -s scripts/tests -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build locked workspace
        run: cargo build --workspace --locked
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test locked workspace
        run: cargo test --workspace --locked
      - name: Verify implemented CLI commands
        run: |
          cargo run --locked -p ripple-cli -- --help
          cargo run --locked -p ripple-cli -- --version
          cargo run --locked -p ripple-cli -- inspect src/caller.ts --root fixtures/inspect/project
          cargo run --locked -p ripple-cli -- inspect src/view.tsx --root fixtures/inspect/project --format json
      - name: Clean install M2 candidate
        run: cargo install --path crates/ripple-cli --locked --root target/m2-install
      - name: Verify installed M2 commands
        run: python scripts/m2-smoke.py --install-root target/m2-install
