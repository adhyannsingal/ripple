name: Candidate artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: cargo install --locked --path crates/ripple-cli --target ${{ matrix.target }} --root target/candidate-install
      - run: python scripts/m7-smoke.py --install-root target/candidate-install
      - name: Prepare verified archive and notices
        shell: bash
        run: |
          binary=target/candidate-install/bin/ripple
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          python scripts/release.py prepare --binary "$binary" --output target/candidate-dist --target ${{ matrix.target }}
          python scripts/release.py verify --directory target/candidate-dist --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-${{ matrix.target }}
          path: target/candidate-dist/*
          if-no-files-found: error
          retention-days: 14
  unpacked-smoke:
    name: Fresh runner ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-${{ matrix.target }}
          path: candidate
      - run: python scripts/release.py verify --directory candidate --smoke
